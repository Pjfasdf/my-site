<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Multi-Ticker Dashboard</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
  /* height is also set explicitly in JS (window.innerHeight, recalculated
     on resize) -- these vh/vw values are just a fallback for the instant
     before that JS runs. Plain 100vh/100vw was leaving a blank strip at
     the bottom in at least one setup (viewed through Chrome Remote
     Desktop, going fullscreen after the page had already loaded) where
     the viewport-unit value didn't end up matching the actual rendered
     window height. */
  #panes { display: flex; height: 100vh; width: 100vw; box-sizing: border-box; }
  .pane { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #000; min-width: 0; }
  .pane:last-child { border-right: none; }
  .pane-bar {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    background: #222; transition: background-color 0.15s;
  }
  .pane-bar input {
    flex: 1; font-size: 14px; font-weight: bold; text-transform: uppercase;
    padding: 5px 7px; border: 1px solid #555; border-radius: 3px;
  }
  .pane-bar button {
    padding: 5px 12px; font-size: 13px; cursor: pointer; border: none;
    border-radius: 3px; background: #444; color: white;
  }
  .pane-bar button:hover { background: #666; }
  .pane iframe { flex: 1; border: none; width: 100%; background: white; }
</style>
</head>
<body>
  <div id="panes"></div>
  <script>
    // dashboard_High.html is served from this same output folder by
    // serve_output.py, so a plain relative path + query string works
    // exactly like typing it into the address bar yourself.
    const DASHBOARD_PATH = 'dashboard_High.html';
    // Mirrors dashboard_High.html's own ticker-specific header-color
    // fallback table, so each pane's top bar matches the accent color
    // you're used to seeing on that ticker's own tab.
    const TICKER_COLORS = { SPX: '#007bff', SPY: '#ff00ff', QQQ: '#ff9900' };
    // Change this list (add/remove entries) to change how many panes show
    // by default and which tickers they start on.
    const DEFAULT_TICKERS = ['SPX', 'SPY', 'QQQ'];
 
    // Reads ?t1=..&t2=..&t3=.. from the URL so a specific combo of
    // tickers/panes can be bookmarked -- falls back to DEFAULT_TICKERS for
    // any slot not present in the URL.
    function getInitialTickers() {
        const params = new URLSearchParams(window.location.search);
        return DEFAULT_TICKERS.map((def, i) => (params.get('t' + (i + 1)) || def).toUpperCase());
    }
 
    // Keeps the address bar in sync with whatever's currently loaded in
    // each pane (via history.replaceState, no page reload) so refreshing
    // or bookmarking the page preserves the exact combo you're looking at.
    function updateUrl(tickers) {
        const params = new URLSearchParams();
        tickers.forEach((t, i) => params.set('t' + (i + 1), t));
        history.replaceState(null, '', '?' + params.toString());
    }
 
    function buildPane(index, initialTicker, tickers) {
        const pane = document.createElement('div');
        pane.className = 'pane';
 
        const bar = document.createElement('div');
        bar.className = 'pane-bar';
 
        const input = document.createElement('input');
        input.type = 'text';
        input.value = initialTicker;
        input.spellcheck = false;
 
        const btn = document.createElement('button');
        btn.textContent = 'Load';
 
        const iframe = document.createElement('iframe');
 
        function loadTicker(rawTicker) {
            const upper = rawTicker.trim().toUpperCase();
            if (!upper) return;
            tickers[index] = upper;
            input.value = upper;
            iframe.src = `${DASHBOARD_PATH}?ticker=${encodeURIComponent(upper)}`;
            bar.style.backgroundColor = TICKER_COLORS[upper] || '#222';
            updateUrl(tickers);
        }
 
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadTicker(input.value); });
        btn.addEventListener('click', () => loadTicker(input.value));
 
        bar.appendChild(input);
        bar.appendChild(btn);
        pane.appendChild(bar);
        pane.appendChild(iframe);
 
        loadTicker(initialTicker);
        return pane;
    }
 
    const tickers = getInitialTickers();
    const panesEl = document.getElementById('panes');
    tickers.forEach((t, i) => panesEl.appendChild(buildPane(i, t, tickers)));
 
    // Explicit pixel height instead of relying on 100vh alone -- covers
    // the case (seen over Chrome Remote Desktop) where the page loads at
    // one window size, then the browser goes fullscreen afterward and the
    // vh unit doesn't end up matching the new, larger rendered height.
    // Re-run on resize/fullscreen-toggle/orientation-change so it stays
    // correct if the window is ever resized again later too.
    function fitToWindow() {
        panesEl.style.height = window.innerHeight + 'px';
        panesEl.style.width = window.innerWidth + 'px';
    }
    fitToWindow();
    window.addEventListener('resize', fitToWindow);
    // Some browsers fire 'resize' late (or not at all) right after a
    // fullscreen transition -- a couple of delayed re-checks catch that
    // without needing a continuous polling loop.
    setTimeout(fitToWindow, 100);
    setTimeout(fitToWindow, 500);
    document.addEventListener('fullscreenchange', () => setTimeout(fitToWindow, 50));
  </script>
</body>
</html>
